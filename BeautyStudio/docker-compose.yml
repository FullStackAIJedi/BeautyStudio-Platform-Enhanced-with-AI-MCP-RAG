services:

  # ==========================================
  # SQL SERVER
  # ==========================================
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU28-ubuntu-22.04
    container_name: beautystudio-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_PASSWORD}"
    ports:
      - "${SQL_PORT:-1433}:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ==========================================
  # RABBITMQ
  # ==========================================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: beautystudio-rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASS}"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ==========================================
  # IDENTITY API
  # ==========================================
  identity-api:
    build:
      context: .
      dockerfile: Identity/Identity.Api/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Default: "Server=sqlserver;Database=IdentityDb;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      Jwt__Issuer: "${JWT_ISSUER}"
      Jwt__Audience: "${JWT_AUDIENCE}"
      Jwt__Secret: "${JWT_SECRET}"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080 && printf \"GET /health HTTP/1.0\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -q \"200 OK\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  # ==========================================
  # SALON API
  # ==========================================
  salon-api:
    build:
      context: .
      dockerfile: Salon/Salon.Api/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Default: "Server=sqlserver;Database=SalonDb;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      Jwt__Issuer: "${JWT_ISSUER}"
      Jwt__Audience: "${JWT_AUDIENCE}"
      Jwt__Secret: "${JWT_SECRET}"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Username: "${RABBITMQ_USER}"
      RabbitMq__Password: "${RABBITMQ_PASS}"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080 && printf \"GET /health HTTP/1.0\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -q \"200 OK\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  # ==========================================
  # SHOP API
  # ==========================================
  shop-api:
    build:
      context: .
      dockerfile: Shop/Shop.Api/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Default: "Server=sqlserver;Database=ShopDb;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      Jwt__Issuer: "${JWT_ISSUER}"
      Jwt__Audience: "${JWT_AUDIENCE}"
      Jwt__Secret: "${JWT_SECRET}"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Username: "${RABBITMQ_USER}"
      RabbitMq__Password: "${RABBITMQ_PASS}"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080 && printf \"GET /health HTTP/1.0\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -q \"200 OK\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  # ==========================================
  # DATABASE SEED ROLES
  # ==========================================
  database-seed:
    image: mcr.microsoft.com/mssql/server:2022-CU28-ubuntu-22.04
    depends_on:
      identity-api:
        condition: service_healthy
    environment:
      SQL_PASSWORD: "${SQL_PASSWORD}"
    volumes:
      - ./Database/init.sql:/scripts/init.sql:ro
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd"]
    command: 
      - "-S"
      - "sqlserver"
      - "-U"
      - "sa"
      - "-P"
      - "${SQL_PASSWORD}"
      - "-C"
      - "-b"
      - "-i"
      - "/scripts/init.sql"
    restart: "no"

  # ==========================================
  # API GATEWAY 
  # ==========================================
  gateway:
    build:
      context: .
      dockerfile: Gateway/Gateway/Dockerfile
    ports:
      - "${GATEWAY_PORT:-5000}:8080"
    depends_on:
      identity-api:
        condition: service_healthy
      salon-api:
        condition: service_healthy
      shop-api:
        condition: service_healthy
    environment:
      Jwt__Issuer: "${JWT_ISSUER}"
      Jwt__Audience: "${JWT_AUDIENCE}"
      Jwt__Secret: "${JWT_SECRET}" 
    restart: unless-stopped

volumes:
  sql_data: